name: Network-state development build

on:
  push:
    branches: [support/network-state-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-state-development
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        task: [app, tests]
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: native-openemu-${{ matrix.task }}-v1-${{ github.sha }}
          restore-keys: native-openemu-${{ matrix.task }}-v1-
      - name: Apply audio underrun fix
        run: |
          git -C OpenEmuKit fetch --depth=2 https://github.com/clopezadereso/OpenEmuKit.git 6e0de4f9101b08e147fb0241361306809bc6a1e4
          git -C OpenEmuKit show --format= 6e0de4f9101b08e147fb0241361306809bc6a1e4 | git -C OpenEmuKit apply
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Resolve removed ZIPFoundation development branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('OpenEmu-Shaders/OpenEmuShaders.xcodeproj/project.pbxproj')
          source = path.read_text()
          old = 'branch = development;\n\t\t\t\tkind = branch;'
          new = 'kind = upToNextMinorVersion;\n\t\t\t\tminimumVersion = 0.9.0;'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one obsolete package reference')
          path.write_text(source.replace(old, new))
          PY
      - name: Build OpenEmu
        if: matrix.task == 'app'
        run: |
          set -o pipefail
          xcodebuild -workspace OpenEmu.xcworkspace -scheme OpenEmu \
            -configuration Release -sdk macosx -arch arm64 \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO MACOSX_DEPLOYMENT_TARGET=12.0 \
            build 2>&1 | tee build.log
      - name: Build matching SNES9x core
        if: matrix.task == 'app'
        run: |
          set -o pipefail
          xcodebuild -workspace OpenEmu.xcworkspace -scheme SNES9x \
            -configuration Release -sdk macosx -arch arm64 \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO MACOSX_DEPLOYMENT_TARGET=12.0 \
            build 2>&1 | tee core-build.log
      - name: Test OpenEmuKit
        if: matrix.task == 'tests'
        run: |
          set -o pipefail
          xcodebuild -workspace OpenEmu.xcworkspace -scheme OpenEmuKit \
            -configuration Debug -destination 'platform=macOS' -arch x86_64 \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO MACOSX_DEPLOYMENT_TARGET=12.0 \
            test 2>&1 | tee tests.log
      - name: Package development app
        if: matrix.task == 'app'
        run: |
          ditto -c -k --keepParent DerivedData/Build/Products/Release/OpenEmu.app OpenEmu-development.zip
          ditto -c -k --keepParent DerivedData/Build/Products/Release/SNES9x.oecoreplugin SNES9x-development.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-state-development-${{ matrix.task }}
          path: |
            build.log
            tests.log
            core-build.log
            SNES9x-development.zip
            OpenEmu-development.zip
          retention-days: 1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: DerivedData
          key: native-openemu-${{ matrix.task }}-v1-${{ github.sha }}
